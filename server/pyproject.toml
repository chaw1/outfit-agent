[project]
name = "outfit-agent-server"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "alembic>=1.15,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1",
  "bcrypt>=4.2,<6",
  "PyJWT>=2.10,<3",
  "python-multipart>=0.0.20",
  "Pillow>=11,<13",
  "pillow-heif>=1.0,<2",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the dedicated local PostgreSQL"]
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]
