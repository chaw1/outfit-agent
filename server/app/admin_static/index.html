      el('users-filter').addEventListener('submit',e=>{e.preventDefault();state.users.q=el('user-search').value.trim();render('users')});
      document.querySelectorAll('[data-user-toggle]').forEach(b=>b.addEventListener('click',()=>act(b,async()=>{await request('/users/'+encodeURIComponent(b.dataset.userToggle),{method:'PATCH',body:{disabled:b.dataset.disabled==='true'}});toast(b.dataset.disabled==='true'?'用户已禁用':'用户已启用');render('users')})));
      document.querySelectorAll('[data-user-tier]').forEach(select=>select.addEventListener('change',()=>act(select,async()=>{try{await request('/users/'+encodeURIComponent(select.dataset.userTier),{method:'PATCH',body:{tier:select.value}});toast('用户层级已更新');render('users')}catch(err){const user=rows.find(u=>u.id===select.dataset.userTier);select.value=user.tier;throw err}})));
    }
    el('login-form').addEventListener('submit',e=>{e.preventDefault();const button=el('login-submit');button.disabled=true;el('login-error').classList.add('hidden');request('/login',{method:'POST',body:{token:el('admin-token').value}}).then(d=>{token=d.token;sessionStorage.setItem('outfit_admin_session',token);el('admin-token').value='';render(location.hash.slice(1)||'overview')}).catch(err=>{el('login-error').textContent=err.message;el('login-error').classList.remove('hidden')}).finally(()=>{button.disabled=false})});
    el('toggle-password').addEventListener('click',()=>{const input=el('admin-token'),show=input.type==='password';input.type=show?'text':'password';el('toggle-password').setAttribute('aria-label',show?'隐藏口令':'显示口令')});
    el('logout').addEventListener('click',()=>{version++;loggedOut();toast('已退出管理台')});
    window.addEventListener('hashchange',()=>render(location.hash.slice(1)));
    paintIcons();if(token)render(location.hash.slice(1)||'overview');else loggedOut();
  })();
  </script>
</body>
</html>
